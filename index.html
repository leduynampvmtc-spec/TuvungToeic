<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Từ vựng TOEIC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1322" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}button,select,input{font-family:inherit}</style>
<title>Sổ từ vựng TOEIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow study column; sticky control bar (lesson + mode); exercise rows like ruled notebook lines */
:root{
  --bg:#F3F5F9; --paper:#FFFFFF; --ink:#16203A; --muted:#5E6782; --line:#DDE2EC;
  --accent:#2448B8; --accent-soft:#E4EAFB; --mark:#FFE45C;
  --ok:#14804A; --ok-soft:#DFF3E7; --bad:#C2352B; --bad-soft:#FBE4E1;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --paper:#161D30; --ink:#E7EBF5; --muted:#9AA3BD; --line:#2A3350;
  --accent:#8EA8FF; --accent-soft:#222E52; --mark:#D9B92E;
  --ok:#5BD08F; --ok-soft:#173527; --bad:#FF8A7F; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322; --paper:#161D30; --ink:#E7EBF5; --muted:#9AA3BD; --line:#2A3350;
  --accent:#8EA8FF; --accent-soft:#222E52; --mark:#D9B92E;
  --ok:#5BD08F; --ok-soft:#173527; --bad:#FF8A7F; --bad-soft:#3A1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px}
header h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
header h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%)}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row1{display:flex;gap:8px;align-items:center}
.row1 button{flex:none}
select{flex:1;min-width:0;font:600 1rem var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .86rem var(--sans);padding:8px 4px;border-radius:9px;cursor:pointer;line-height:1.2}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--paper)}
.btn{font:600 .92rem var(--sans);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:focus-visible,.tabs button:focus-visible,select:focus-visible,input:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.status .hint{color:var(--muted);font-size:.88rem}
.score{font:500 .9rem var(--mono);background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:2.6rem 1fr;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.num{font:500 .8rem var(--mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.prompt{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.prompt.vn{font-weight:600;font-size:1rem}
input[type=text]{width:100%;font:500 1rem var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.item.ok input{border-color:var(--ok);background:var(--ok-soft)}
.item.bad input{border-color:var(--bad);background:var(--bad-soft)}
.ans{font-size:.9rem;color:var(--muted)}
.ans b{color:var(--ok)}
.item.bad .ans b{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* flashcard */
.fc-wrap{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:260px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;position:relative;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 54px;transition:transform .25s}
.card .tag{position:absolute;top:12px;left:16px;font:500 .78rem var(--mono);color:var(--muted)}
.card .known{position:absolute;top:10px;right:14px;font-size:.78rem;font-weight:700;color:var(--ok)}
.card .front{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;background:var(--paper);padding:0 6px}
.card .front.vn{font-size:1.25rem;font-weight:700}
.card .back{display:flex;flex-direction:column;gap:8px;background:var(--paper);padding:6px;border-radius:8px;max-width:100%}
.card .back .w{font-size:1.3rem;font-weight:800}
.card .back .m{font-size:1.08rem;font-weight:600;color:var(--accent)}
.card .back .o{font-size:.86rem;color:var(--muted)}
.card .back .ex{font-size:.92rem;font-style:italic}
.card .tap{font-size:.8rem;color:var(--muted);background:var(--paper);padding:0 6px}
.card .rel{margin:6px 0 0;display:flex;flex-direction:column;gap:6px;text-align:left;border-top:1px dashed var(--line);padding-top:10px;width:100%}
.card .rel div{display:grid;grid-template-columns:6.6rem 1fr;gap:8px;align-items:baseline}
.card .rel dt{font:600 .72rem var(--sans);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:6px;text-align:center}
.card .rel dt.sy{background:var(--ok-soft);color:var(--ok)}
.card .rel dt.an{background:var(--bad-soft);color:var(--bad)}
.card .rel dt.re{background:var(--accent-soft);color:var(--accent)}
.card .rel dd{margin:0;font-size:.92rem;overflow-wrap:anywhere;min-width:0}
.card .back{width:100%;max-width:520px}
.fc-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fc-sub{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fc-sub .btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* fill blank */
.sent{font-size:1rem;line-height:1.6}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;font-weight:700;padding:0 4px}
.item.ok .blank{color:var(--ok);border-color:var(--ok)}
.item.bad .blank{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{font:500 .93rem var(--sans);text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;cursor:pointer;overflow-wrap:anywhere}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.passage .ptype{font:500 .78rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.passage .ptitle{font-weight:800;font-size:1.15rem;margin:0;text-wrap:balance}
.passage .ptext{font-size:1rem;line-height:1.7;max-width:68ch}
.passage .ptext p{margin:0 0 8px}
.passage mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 3px;font-weight:600;cursor:help;border-bottom:2px solid var(--accent)}
.passage mark[data-open="1"]::after{content:" (" attr(data-m) ")";font-weight:500;color:var(--accent)}
.vtoggle{align-self:flex-start}
.qnum{font:500 .8rem var(--mono);color:var(--muted)}
.expl{font-size:.9rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.item.ok .expl{border-left:3px solid var(--ok)}
.item.bad .expl{border-left:3px solid var(--bad)}
.section-h{font-weight:700;font-size:1rem;margin:18px 0 8px}
@media (max-width:620px){.tabs{grid-template-columns:repeat(3,1fr)}}
.credit{margin-top:40px;padding:18px 16px;border-top:1px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:.9rem}
.credit-photo{width:132px;height:132px;border-radius:50%;object-fit:cover;margin:0 auto 10px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--mark)}
.credit-label{font:500 .74rem var(--mono);text-transform:uppercase;letter-spacing:.08em}
.credit-name{font-weight:800;font-size:1.05rem;color:var(--ink)}
.credit-phone a{color:var(--accent);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums;user-select:all}
.pron{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.pron.sm{margin-top:4px;font-size:.85rem}
.pos{font:600 .75rem var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px;white-space:nowrap}
.pos.inl{vertical-align:middle;margin-left:4px}
.ipa{font-family:"Lucida Sans Unicode","Segoe UI","Noto Sans",system-ui,sans-serif;color:var(--muted)}
.spk{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--accent);cursor:pointer;padding:0}
.spk:active{transform:scale(.94)}
.spk:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.card .pron{justify-content:center;background:var(--paper);padding:0 6px;border-radius:8px}
.card .back .pron{justify-content:center}
.mode-note{font-size:.88rem;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;margin:-2px 0 10px}
.qtag{align-self:flex-start;font:600 .7rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.qtext{font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.dform{display:flex;gap:8px;margin-bottom:12px}
.dform input{flex:1;min-width:0;width:auto}
input[type=search]{font:500 1.05rem var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.dcard.g{border-color:var(--accent)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dhead h3{margin:0;font-size:1.25rem;font-weight:800;overflow-wrap:anywhere}
.dsrc{font:500 .72rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dmean{font-weight:600;color:var(--accent);font-size:1.02rem}
.dex{font-style:italic;font-size:.93rem;line-height:1.6}
.dex .spk,.dcard .muted+.spk{vertical-align:middle;margin-left:4px;width:28px;height:28px}
[hidden]{display:none!important}
.dcard .rel{display:flex;flex-direction:column;gap:6px;margin:0}
.dcard .rel div{display:grid;grid-template-columns:6.6rem 1fr;gap:8px;align-items:baseline}
.dcard .rel dt{font:600 .72rem var(--sans);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:6px;text-align:center}
.dcard .rel dt.sy{background:var(--ok-soft);color:var(--ok)}.dcard .rel dt.an{background:var(--bad-soft);color:var(--bad)}.dcard .rel dt.re{background:var(--accent-soft);color:var(--accent)}
.dcard .rel dd{margin:0;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.btn.sm{padding:6px 10px;font-size:.85rem;align-self:flex-start}
.gsec{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.gh{font:600 .75rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.gpos ul,.gpos ol{margin:4px 0 0;padding-left:20px}.gpos li{margin:2px 0}
.muted{color:var(--muted)}
.glink{color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none;align-self:flex-start}
.loading{color:var(--muted);padding:10px 0}
.trbox{display:flex;flex-direction:column;gap:10px}
.trdir{display:flex;gap:8px;align-items:center}.trdir select{flex:1}
textarea{width:100%;font:400 1rem/1.6 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;min-height:140px}
textarea:focus-visible,input[type=search]:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.trout{background:var(--paper);border:1px solid var(--accent);border-radius:12px;padding:14px}
.trtext{white-space:pre-wrap;line-height:1.7;font-size:1rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sync-btn{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.on,.sync-btn[data-state=on] .dot{background:var(--ok)}
.sync-btn[data-state=busy] .dot{background:var(--mark)}
.sync-btn[data-state=err] .dot{background:var(--bad)}
.sync-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.sync-card h2{margin:0;font-size:1.05rem;font-weight:800}
.sync-card h2 .muted{font-weight:500;font-size:.85rem}
.sync-row{display:flex;align-items:center;gap:8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.steps a{color:var(--accent);font-weight:600}
.steps code{font-family:var(--mono);background:var(--bg);padding:0 4px;border-radius:4px}
.sync-dev{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.sync-dev input{flex:1;min-width:0;font:500 .95rem var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.sync-msg{font-size:.9rem;color:var(--ok);min-height:1em}
.sync-msg.err{color:var(--bad)}
.small{font-size:.82rem;line-height:1.5}
.dform input[type=password]{flex:1;min-width:0;font:500 1rem var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.empty{padding:20px;color:var(--muted);text-align:center}
@media (max-width:420px){.opts{grid-template-columns:1fr}.tabs button{font-size:.8rem}.card .front{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><h1><span>Sổ từ vựng TOEIC</span></h1><button class="btn sm sync-btn" id="syncBtn" type="button" data-state="off"><span class="dot"></span>Đồng bộ</button></div>
    <p>Bài 1–29: 582 từ trong sổ của anh, giữ đúng thứ tự. Bài 30–59: 602 từ TOEIC cốt lõi theo chủ đề. Mỗi bài 20 từ, có đọc hiểu và ngữ pháp.</p>
  </header>

  <div class="bar">
    <div class="row1">
      <button class="btn" id="prev" aria-label="Bài trước">‹</button>
      <select id="lesson" aria-label="Chọn bài"></select>
      <button class="btn" id="next" aria-label="Bài sau">›</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-mode="en" aria-selected="true">Anh → Việt</button>
      <button role="tab" data-mode="vn" aria-selected="false">Việt → Anh</button>
      <button role="tab" data-mode="fc" aria-selected="false">Flashcard</button>
      <button role="tab" data-mode="fill" aria-selected="false">Điền từ</button>
      <button role="tab" data-mode="read" aria-selected="false">Đọc hiểu</button>
      <button role="tab" data-mode="gram" aria-selected="false">Ngữ pháp</button>
      <button role="tab" data-mode="den" aria-selected="false">Tra Anh–Việt</button>
      <button role="tab" data-mode="dvi" aria-selected="false">Tra Việt–Anh</button>
      <button role="tab" data-mode="tr" aria-selected="false">Dịch đoạn văn</button>
    </div>
  </div>

let VOICES=[];try{VOICES=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{VOICES=speechSynthesis.getVoices()}}catch(e){}
let AUD=null;
function speak(t,lang){
  lang=lang||'en';const want=lang==='vi'?/^vi/i:/^en(-|_)US/i;
  const v=VOICES.find(v=>want.test(v.lang))||(lang==='en'&&VOICES.find(v=>/^en/i.test(v.lang)));
  if(CAN_SPEAK&&v){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.9;speechSynthesis.speak(u);return}catch(e){}}
  try{if(AUD)AUD.pause();AUD=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+lang+'&q='+encodeURIComponent(String(t).slice(0,190)));AUD.play().catch(()=>toast('Máy chưa có giọng đọc và đang không có mạng.'))}catch(e){toast('Không phát được âm thanh.')}
}
function spkBtn(text,lang){return `<button class="spk" type="button" data-say="${esc(text)}" data-lang="${lang||'en'}" aria-label="Nghe ${esc(text)}">${SPK_SVG}</button>`}
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',2600)}

function gUrl(text,sl,tl){return `https://translate.google.com/?sl=${sl}&tl=${tl}&text=${encodeURIComponent(text)}&op=translate`}
async function gtx(text,sl,tl,full){
  const dt=full?['t','bd','md','ex','ss','rm']:['t','rm'];
  const u='https://translate.googleapis.com/translate_a/single?client=gtx&dj=1&sl='+sl+'&tl='+tl+dt.map(d=>'&dt='+d).join('')+'&q='+encodeURIComponent(text);
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),9000);
  try{const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}
}

function gParse(j){
  const sent=(j.sentences||[]);
  return {
    trans:sent.map(s=>s.trans||'').join(''),
    srcTr:(sent.find(s=>s.src_translit)||{}).src_translit||'',
    dict:(j.dict||[]).map(d=>({pos:d.pos,terms:(d.entry||[]).slice(0,8).map(e=>({w:e.word,back:(e.reverse_translation||[]).slice(0,4)}))})),
    defs:(j.definitions||[]).map(d=>({pos:d.pos,items:(d.entry||[]).slice(0,3).map(e=>({g:e.gloss,ex:e.example}))})),
    exs:((j.examples||{}).example||[]).slice(0,4).map(e=>String(e.text||'').replace(/<\/?b>/g,'')),
    syn:(j.synsets||[]).map(s=>({pos:s.pos,list:(s.entry||[]).slice(0,2).flatMap(e=>e.synonym||[]).slice(0,8)})),
    src:j.src
  };
}
const POSVI={noun:'danh từ (n)',verb:'động từ (v)',adjective:'tính từ (adj)',adverb:'trạng từ (adv)',preposition:'giới từ (prep)',conjunction:'liên từ (conj)',pronoun:'đại từ (pron)',interjection:'thán từ',abbreviation:'viết tắt',phrase:'cụm từ',
  'danh từ':'danh từ (n)','động từ':'động từ (v)','tính từ':'tính từ (adj)','trạng từ':'trạng từ (adv)','giới từ':'giới từ (prep)','liên từ':'liên từ (conj)'};

function lessonOf(n){return LMETA.findIndex(m=>m.ids.includes(n))}
function localSearch(q,dir){
  const x=norm(q);if(!x)return [];
  const res=[];const W=DATA.filter(o=>!o.g);
  if(dir==='en'){
    W.forEach(o=>{const w=norm(o.w),a=norm(o.a);let sc=0;
      if(w===x||a===x)sc=100;else if(w.startsWith(x)||a.startsWith(x))sc=60;else if(w.split(' ').includes(x))sc=50;else if(x.length>=3&&w.includes(x))sc=30;
      else if(norm(o.re||'').split(/[ ,]+/).includes(x)||norm(o.sy||'').split(/[ ,]+/).includes(x))sc=20;
      if(sc)res.push([sc,o])});
  }else{
    const raw=q.trim().toLowerCase();
    W.forEach(o=>{const m=o.m.toLowerCase();const segs=m.split(/[,;()=.]/).map(s=>s.trim());let sc=0;
      if(segs.includes(raw))sc=100;else if(m.includes(raw))sc=70;else if(segs.map(norm).includes(x))sc=50;else if(x.length>=2&&(' '+norm(m)+' ').includes(' '+x+' '))sc=30;
      if(sc)res.push([sc,o])});
  }
  return res.sort((a,b)=>b[0]-a[0]||a[1].n-b[1].n).slice(0,12).map(r=>r[1]);
}
const DICT=(BUNDLE.d||[]).map(([w,p,i,m])=>({w,p,i,m,dict:1}));
function dictSearch(q,dir){
  const x=norm(q);if(!x)return [];const res=[];
  DICT.forEach(o=>{let sc=0;
    if(dir==='en'){const w=norm(o.w);if(w===x)sc=100;else if(w.startsWith(x))sc=60-Math.min(w.length-x.length,30);else if(x.length>=4&&w.includes(x))sc=20;
      else if(x.length>3&&(x.startsWith(w)&&x.length-w.length<=3))sc=40;}
    else{const m=o.m.toLowerCase(),raw=q.trim().toLowerCase();const segs=m.split(/[,;()]/).map(s=>s.trim());
      if(segs.includes(raw))sc=100;else if(m.includes(raw))sc=60;else if(segs.map(norm).includes(x))sc=50;else if(x.length>=3&&(' '+norm(m)+' ').includes(' '+x+' '))sc=25;}
    if(sc)res.push([sc,o])});
  return res.sort((a,b)=>b[0]-a[0]||a[1].w.length-b[1].w.length).slice(0,12).map(r=>r[1]);
}

function googleCard(g,q,sl,tl){

  let h=`<article class="dcard g"><div class="dhead"><h3>${esc(g.trans)}</h3><span class="dsrc">Google Dịch</span></div>

const POSV={n:'Danh từ (n)',v:'Động từ (v)',adj:'Tính từ (adj)',adv:'Trạng từ (adv)'};
const firstMean=m=>String(m).split(/[,;(]/)[0].trim();
const firstSyn=s=>String(s||'').split(',')[0].trim();
function wordForms(o){
  const set=new Set();(o.re||'').split(/[,;]/).forEach(p=>{const t=p.split(/[(:≠=]/)[0].trim().toLowerCase();if(/^[a-z]+$/.test(t))set.add(t)});
  if(/^[a-z]+$/i.test(o.w))set.add(o.w.toLowerCase());set.delete(String(o.a).toLowerCase());return [...set];
}
// Tạo 1 câu hỏi cho từ o theo kiểu t. Trả về {id,type,html câu hỏi,opts[],a,e,o}
function makeQ(o,t,items,r){const q=makeQ0(o,t,items,r);if(q){q.o=o;q.type=t}return q}
function makeQ0(o,t,items,r){
  const others=items.filter(x=>x.n!==o.n&&!x.g);
  const pick=(arr,k)=>shuffle(arr,r).slice(0,k);
  if(t==='sent'){const pool=[...new Set(items.filter(x=>x.s&&x.n!==o.n).map(x=>String(x.a).toLowerCase()))].filter(x=>x!==String(o.a).toLowerCase());
    return {type:t,q:esc(o.s).replace('___','<span class="blank">&nbsp;</span>'),blank:true,ans:o.a,opts:shuffle([String(o.a).toLowerCase(),...pick(pool,3)],r),a:String(o.a).toLowerCase(),e:`${o.a}: ${o.m}`}}
  if(t==='form'){const f=pick(wordForms(o),3);return {type:t,q:esc(o.s).replace('___','<span class="blank">&nbsp;</span>'),blank:true,ans:o.a,opts:shuffle([String(o.a).toLowerCase(),...f],r),a:String(o.a).toLowerCase(),tag:'Từ loại',e:`Chọn đúng dạng từ: ${o.a}${o.p?' ('+o.p+')':''}. Các dạng khác: ${wordForms(o).join(', ')}.`}}
  if(t==='w2m'){const a=firstMean(o.m);const d=[...new Set(others.map(x=>firstMean(x.m)))].filter(x=>x&&x!==a);return {type:t,q:`“<b>${esc(o.w)}</b>” nghĩa là gì?`,opts:shuffle([a,...pick(d,3)],r),a,tag:'Nghĩa',e:`${o.w}: ${o.m}`}}
  if(t==='m2w'){const d=others.map(x=>x.w);return {type:t,q:`Từ nào có nghĩa: “<b>${esc(firstMean(o.m))}</b>”?`,opts:shuffle([o.w,...pick(d,3)],r),a:o.w,tag:'Chọn từ',e:`${o.w}: ${o.m}`}}
  if(t==='syn'){const a=firstSyn(o.sy);const d=[...new Set(others.map(x=>firstSyn(x.sy)).filter(x=>x&&x!==a))];if(d.length<3)return null;return {type:t,q:`Từ nào <b>đồng nghĩa</b> với “<b>${esc(o.w)}</b>”?`,opts:shuffle([a,...pick(d,3)],r),a,tag:'Đồng nghĩa',e:`${o.w} ≈ ${o.sy}`}}
  if(t==='ant'){const a=firstSyn(o.an);const d=[...new Set(others.map(x=>firstSyn(x.sy)).filter(x=>x&&x!==a))];if(d.length<3)return null;return {type:t,q:`Từ nào <b>trái nghĩa</b> với “<b>${esc(o.w)}</b>”?`,opts:shuffle([a,...pick(d,3)],r),a,tag:'Trái nghĩa',e:`${o.w} ≠ ${o.an}`}}
  if(t==='pos'){const a=POSV[o.p];return {type:t,q:`“<b>${esc(o.w)}</b>” là từ loại gì?`,opts:shuffle(Object.values(POSV),r),a,tag:'Từ loại',e:`${o.w} ${o.i||''}: ${a}`}}
  return null;
}
function typesFor(o){const t=[];if(o.s)t.push('sent');if(!o.g){t.push('w2m','m2w');if(o.sy&&firstSyn(o.sy))t.push('syn');if(o.an&&firstSyn(o.an))t.push('ant');if(POSV[o.p])t.push('pos');if(o.s&&wordForms(o).length>=2)t.push('form')}return t}
function renderMCQ(listQ,{hint,numStart,onDone,itemsRef,fn,opt,withNew,showWord}){
  let done=0,right=0;
  $('#main').innerHTML=`<div class="status"><span class="hint">${hint}</span><span class="score" id="sc">0/${listQ.length}</span></div>${modeNote(opt,listQ.length)}
  <div class="list">${listQ.map((q,qi)=>`<div class="item" data-q="${qi}"><div class="num">${q.num??(numStart+qi)}</div><div class="body">
    ${q.tag?`<span class="qtag">${q.tag}</span>`:''}<div class="${q.blank?'sent':'prompt vn qtext'}">${q.q}</div>
    <div class="opts">${q.opts.map((x,i)=>`<button class="opt" data-i="${i}">${'ABCD'[i]}. ${esc(x)}</button>`).join('')}</div>
    <div class="expl" hidden></div></div></div>`).join('')}</div>
  ${actions('',withNew)}`;
  listQ.forEach((q,qi)=>{const it=$(`.item[data-q="${qi}"]`);it.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=q.opts[+b.dataset.i]===q.a;done++;if(ok)right++;
    it.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.i]===q.a)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');it.classList.add(ok?'ok':'bad');
    if(q.blank){const bl=it.querySelector('.blank');const ans=q.ans||q.a;bl.textContent=/^\s*<span class="blank">/.test(q.q)?ans.charAt(0).toUpperCase()+ans.slice(1):ans}
    const ex=it.querySelector('.expl');ex.hidden=false;ex.innerHTML=esc(q.e)+(q.o?pron(q.o,true):'');
    if(ok)delWrong(q.id);else addWrong(q.id);

/* ---------- Điền từ ---------- */
function renderFill(items,opt={}){
  const s=st();const r=Math.random;s.last=s.last||{};
  let words=items.filter(o=>o.s||!o.g);
  if(opt.only)words=words.filter(o=>opt.only.includes('f'+o.n));
  const seeded=!opt.shuffle&&!opt.fresh&&!opt.only&&!s.att;
  let qs=words.map(o=>{
    let t;
    if(opt.fresh){const ts=typesFor(o);const pref=ts.filter(x=>x!==s.last[o.n]);for(const x of shuffle(pref.length?pref:ts,r)){const q=makeQ(o,x,items,r);if(q){t=q;break}}}
    else if(opt.only&&s.last[o.n]){t=makeQ(o,s.last[o.n],items,r)}
    if(!t&&o.s)t=makeQ(o,'sent',items,seeded?rng(o.n*7919+L):r);
    if(!t&&!opt.fresh)return null;
    if(!t)t=makeQ(o,'w2m',items,r);
    if(t){s.last[o.n]=t.type;t.id='f'+o.n;t.num=o.n}
    return t;
  }).filter(Boolean);
  if(!seeded)qs=shuffle(qs,r);
  renderMCQ(qs,{hint:opt.fresh?'Mỗi từ một kiểu câu hỏi khác nhau: nghĩa, đồng nghĩa, trái nghĩa, từ loại, dạng từ, điền câu.':'Chọn từ thích hợp điền vào chỗ trống.',numStart:1,itemsRef:items,fn:renderFill,opt,withNew:true});
}

/* ---------- Đọc hiểu ---------- */
function markPassage(p,items){
  const paras=esc(p).split('\n').map(par=>par.replace(/\[\[(.+?)\]\]([a-z]*)/g,(m,w,suf)=>{
    const o=findWord(w,items);const mean=o?o.m:'';return `<mark tabindex="0" data-m="${esc(mean)}" title="${esc(mean)}">${w}${suf}</mark>`;}));
  return paras.map(x=>`<p>${x}</p>`).join('');
}
function findWord(w,items){const lw=w.toLowerCase();return items.find(x=>x.w.toLowerCase()===lw)||items.find(x=>x.a&&x.a.toLowerCase()===lw)||items.find(x=>lw.includes(x.w.toLowerCase())||x.w.toLowerCase().includes(lw))||DATA.find(x=>x.w.toLowerCase()===lw||(x.a&&x.a.toLowerCase()===lw))}
function renderRead(items,opt={}){
  const rd=LMETA[L].r;const r=Math.random;
  const [ptype,ptitle]=rd.t.split(' — ');
  let qs;
  if(opt.fresh){
    const ws=[...new Set([...rd.p.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]))].map(w=>findWord(w,items)).filter(o=>o&&!o.g);
    qs=shuffle([...new Map(ws.map(o=>[o.n,o])).values()],r).map(o=>{for(const t of shuffle(['syn','w2m','pos','ant'],r)){const q=makeQ(o,t,items,r);if(q){q.q=q.q.replace('“<b>','Trong đoạn văn, “<b>');q.id='rv'+o.n;q.o=o;return q}}return null}).filter(Boolean).slice(0,5);
  }else{
    qs=rd.q.map((q,qi)=>{const ord=opt.shuffle||st().att?shuffle([0,1,2,3],r):[0,1,2,3];return {q:esc(q.q),opts:ord.map(i=>q.o[i]),a:q.o[q.a],e:q.e,id:'r'+qi,num:qi+1}});
    if(opt.only)qs=qs.filter(q=>opt.only.includes(q.id));
    if(opt.shuffle)qs=shuffle(qs,r);
  }
  if(opt.only&&opt.fresh===undefined){const extra=opt.only.filter(id=>id.startsWith('rv')).map(id=>{const o=BYN[+id.slice(2)];const q=o&&makeQ(o,'w2m',items,r);if(q){q.id=id;q.o=o}return q}).filter(Boolean);qs=qs.concat(extra)}
  renderMCQ(qs,{hint:opt.fresh?'Câu hỏi từ vựng mới về các từ trong đoạn văn.':'Đọc đoạn văn rồi trả lời câu hỏi. Chạm vào từ được tô để xem nghĩa.',numStart:1,itemsRef:items,fn:renderRead,opt,withNew:true});
  $('#main').querySelector('.status').insertAdjacentHTML('afterend',`<article class="passage"><div class="ptype">${esc(ptype||'')}</div><h2 class="ptitle">${esc(ptitle||rd.t)}</h2><div class="ptext">${markPassage(rd.p,items)}</div>
  <button class="btn vtoggle" id="vt">Hiện nghĩa tất cả từ tô màu</button></article><div class="section-h">Câu hỏi</div>`);
  document.querySelectorAll('.passage mark').forEach(m=>{const tg=()=>m.dataset.open=m.dataset.open==='1'?'0':'1';m.onclick=tg;m.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tg()}}});
  let allOpen=false;$('#vt').onclick=()=>{allOpen=!allOpen;document.querySelectorAll('.passage mark').forEach(m=>m.dataset.open=allOpen?'1':'0');$('#vt').textContent=allOpen?'Ẩn nghĩa':'Hiện nghĩa tất cả từ tô màu'};
}

/* ---------- Ngữ pháp ---------- */
const GPOOL=LMETA.flatMap((m,li)=>m.g.map((q,qi)=>({...q,li,qi})));
function gq(q,r){const ord=shuffle([0,1,2,3],r);return {q:esc(q.s).replace('___','<span class="blank">&nbsp;</span>'),blank:true,opts:ord.map(i=>q.o[i]),a:q.o[q.a],ans:q.o[q.a],e:q.e,id:'g'+q.li+'_'+q.qi}}
function renderGram(items,opt={}){
  const r=Math.random;let qs;
  if(opt.fresh){
    // Câu dạng từ tự tạo từ các từ trong bài + câu Part 5 ngẫu nhiên từ các bài khác
    const forms=shuffle(items.filter(o=>o.s&&!o.g&&wordForms(o).length>=2),r).slice(0,6).map(o=>{const q=makeQ(o,'form',items,r);q.id='gf'+o.n;q.o=o;return q});
    const seen=new Set(st().seen||[]);let pool=GPOOL.filter(q=>!seen.has(q.li+'_'+q.qi));if(pool.length<10){seen.clear();pool=GPOOL}
    const pick=shuffle(pool,r).slice(0,10-forms.length);pick.forEach(q=>seen.add(q.li+'_'+q.qi));st().seen=[...seen];
    qs=shuffle([...forms,...pick.map(q=>gq(q,r))],r);
  }else{
    const base=LMETA[L].g.map((q,qi)=>({...q,li:L,qi}));
    qs=base.map(q=>gq(q,opt.shuffle||st().att?r:rng((L+1)*1009+q.qi*31)));
    if(opt.only){qs=qs.filter(q=>opt.only.includes(q.id));
      const ext=opt.only.filter(id=>!qs.some(q=>q.id===id)).map(id=>{if(id.startsWith('gf')){const o=BYN[+id.slice(2)];const q=o&&makeQ(o,'form',items,r);if(q){q.id=id;q.o=o}return q}const m=id.match(/^g(\d+)_(\d+)$/);if(m){const g=LMETA[+m[1]].g[+m[2]];return g&&gq({...g,li:+m[1],qi:+m[2]},r)}return null}).filter(Boolean);qs=qs.concat(ext)}
    if(opt.shuffle)qs=shuffle(qs,r);
  }
  qs.forEach((q,i)=>q.num=101+i);
  renderMCQ(qs,{hint:opt.fresh?'Bộ câu mới: câu chọn dạng từ của bài này và câu Part 5 lấy ngẫu nhiên từ các bài khác.':'Chọn đáp án đúng điền vào chỗ trống (kiểu TOEIC Part 5).',numStart:101,itemsRef:items,fn:renderGram,opt,withNew:true});
}
/* ---------- Đồng bộ tiến độ giữa các máy ---------- */
const rawGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const rawSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,String(v))}catch(e){}};
const SYNCABLE=k=>['lesson','known','fcRev'].includes(k)||k.startsWith('wr:');
const SYNC_FILE='tuvungtoeic-sync.json';
function snapshot(){const d={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(SYNCABLE(k))d[k]=localStorage.getItem(k)}}catch(e){}return d}
function applySnap(d){
  Object.keys(d||{}).forEach(k=>{if(SYNCABLE(k))rawSet(k,d[k])});
  known=new Set(store.get('known',[]));L=Math.min(store.get('lesson',L),lessons.length-1);fcRev=store.get('fcRev',fcRev);
  Object.keys(ST).forEach(k=>delete ST[k]);fcLesson=-1;
}
function mergeSnap(remote,local,remoteWins){
  const out=remoteWins?{...local,...remote}:{...remote,...local};
  const arr=(s)=>{try{return JSON.parse(s)||[]}catch(e){return []}};
  if(remote.known||local.known)out.known=JSON.stringify([...new Set([...arr(remote.known),...arr(local.known)])]);
  return out;
}
function markLocalChange(){rawSet('syncT',Date.now());schedulePush()}
const _set=store.set;store.set=(k,v)=>{_set(k,v);if(SYNCABLE(k))markLocalChange()};
function devName(){return rawGet('devName')||(/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent)?'Điện thoại':'Máy tính')}
function fmtTime(t){if(!t)return 'chưa có';const d=new Date(+t);return d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}
let syncState={busy:false,msg:'',err:''};
function setSyncMsg(msg,err){syncState.msg=msg||'';syncState.err=err||'';updateSyncBadge();const m=$('#syncMsg');if(m){m.textContent=err||msg;m.className='sync-msg'+(err?' err':'')}}
function updateSyncBadge(){const b=$('#syncBtn');if(!b)return;const on=!!rawGet('ghTok');b.dataset.state=syncState.err?'err':on?(syncState.busy?'busy':'on'):'off';b.title=on?(syncState.err||'Đồng bộ lần cuối: '+fmtTime(rawGet('syncAt'))):'Chưa bật đồng bộ'}

async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+rawGet('ghTok'),'Accept':'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401)throw new Error('Mã GitHub không đúng hoặc đã hết hạn.');
  if(r.status===404)throw new Error('Không tìm thấy dữ liệu đồng bộ (mã có thể thiếu quyền gist).');
  if(!r.ok)throw new Error('GitHub báo lỗi '+r.status+'.');
  return r.status===204?null:r.json();
}
async function findGist(){
  let id=rawGet('gistId');if(id)return id;
  const list=await gh('/gists?per_page=100');const g=list.find(g=>g.files&&g.files[SYNC_FILE]);
  if(g){rawSet('gistId',g.id);return g.id}
  const n=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Sổ từ vựng TOEIC - đồng bộ tiến độ học',public:false,files:{[SYNC_FILE]:{content:JSON.stringify({t:0,dev:'',d:{}})}}})});
  rawSet('gistId',n.id);return n.id;
}
async function pullRemote(){const id=await findGist();const g=await gh('/gists/'+id);const f=g.files[SYNC_FILE];if(!f)return {t:0,d:{}};
  let c=f.content;if(f.truncated){c=await (await fetch(f.raw_url,{cache:'no-store'})).text()}try{return JSON.parse(c)}catch(e){return {t:0,d:{}}}}
async function pushRemote(t){const id=await findGist();const body={t,dev:devName(),d:snapshot()};
  await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[SYNC_FILE]:{content:JSON.stringify(body)}}})});rawSet('syncRemoteT',t)}
async function syncNow(manual){
  if(!rawGet('ghTok')||syncState.busy)return;
  if(!navigator.onLine){setSyncMsg('','Đang không có mạng. Tiến độ vẫn lưu trên máy và sẽ đồng bộ khi có mạng.');return}
  syncState.busy=true;updateSyncBadge();
  try{
    const r=await pullRemote();const lt=+rawGet('syncT')||0,rt=+rawGet('syncRemoteT')||0;
    const remoteNew=(r.t||0)>rt, localNew=lt>rt;
    let msg='Đã đồng bộ, không có gì mới.';
    if(remoteNew&&!localNew){applySnap(r.d);rawSet('syncT',r.t);rawSet('syncRemoteT',r.t);msg='Đã tải tiến độ từ '+(r.dev||'máy khác')+' ('+fmtTime(r.t)+').';if(MODE!=='sync')render()}
    else if(localNew&&!remoteNew){await pushRemote(lt);msg='Đã lưu tiến độ lên GitHub.'}
    else if(localNew&&remoteNew){const m=mergeSnap(r.d||{},snapshot(),(r.t||0)>lt);applySnap(m);const t=Date.now();rawSet('syncT',t);await pushRemote(t);msg='Đã gộp tiến độ của hai máy.';if(MODE!=='sync')render()}
    rawSet('syncAt',Date.now());setSyncMsg((manual||remoteNew||localNew)?msg:syncState.msg);
  }catch(e){setSyncMsg('',/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'Không kết nối được GitHub (mất mạng hoặc trang đang chặn kết nối).':e.message)}
  finally{syncState.busy=false;updateSyncBadge();if(MODE==='sync')renderSyncInfo()}
}
let pushTimer;function schedulePush(){if(!rawGet('ghTok'))return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncNow(false),4000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow(false);else if(rawGet('ghTok')&&(+rawGet('syncT')||0)>(+rawGet('syncRemoteT')||0)){clearTimeout(pushTimer);syncNow(false)}});
window.addEventListener('online',()=>syncNow(false));

    <div class="actions" style="margin-top:0"><button class="btn" id="impCode">Nhập tiến độ</button></div>
    <div id="codeMsg" class="sync-msg"></div></section>
  <p class="muted small">Mã GitHub chỉ có quyền tạo một ghi chú bí mật (gist) chứa tiến độ học, không đụng tới các repo của anh. Mã được lưu trên từng máy, không gửi đi đâu khác ngoài GitHub. Lưu ý: trên iPhone, app ở màn hình chính và Safari lưu dữ liệu riêng, nên hãy dán mã vào trong app.</p>`;
  renderSyncInfo();
  $('#devIn').onchange=e=>{rawSet('devName',e.target.value.trim()||null);renderSyncInfo()};
  $('#cpCode').onclick=()=>{const c=exportCode();const ta=$('#codeIn');
    const done=()=>{$('#codeMsg').className='sync-msg';$('#codeMsg').textContent='Đã sao chép mã ('+Object.keys(snapshot()).length+' mục). Gửi mã này sang máy kia.'};
    (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(done,()=>{ta.value=c;ta.select();$('#codeMsg').textContent='Mã đã hiện trong ô, bấm giữ để sao chép.'})};
  $('#impCode').onclick=()=>{try{const o=importCode($('#codeIn').value);$('#codeMsg').className='sync-msg';$('#codeMsg').textContent='Đã nhập tiến độ (tạo lúc '+fmtTime(o.t)+'). Đã thuộc: '+known.size+' từ.';$('#codeIn').value=''}catch(e){$('#codeMsg').className='sync-msg err';$('#codeMsg').textContent=e.message||'Mã không hợp lệ.'}};
}

$('#syncBtn').onclick=()=>{MODE='sync';render();window.scrollTo(0,0)};updateSyncBadge();
render();
setTimeout(()=>syncNow(false),600);
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
