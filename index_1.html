<head>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}button,select,input{font-family:inherit}</style>
<title>Sổ từ vựng TOEIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow study column; sticky control bar (lesson + mode); exercise rows like ruled notebook lines */
:root{
  --bg:#F3F5F9; --paper:#FFFFFF; --ink:#16203A; --muted:#5E6782; --line:#DDE2EC;
  --accent:#2448B8; --accent-soft:#E4EAFB; --mark:#FFE45C;
  --ok:#14804A; --ok-soft:#DFF3E7; --bad:#C2352B; --bad-soft:#FBE4E1;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --paper:#161D30; --ink:#E7EBF5; --muted:#9AA3BD; --line:#2A3350;
  --accent:#8EA8FF; --accent-soft:#222E52; --mark:#D9B92E;
  --ok:#5BD08F; --ok-soft:#173527; --bad:#FF8A7F; --bad-soft:#3A1E1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322; --paper:#161D30; --ink:#E7EBF5; --muted:#9AA3BD; --line:#2A3350;
  --accent:#8EA8FF; --accent-soft:#222E52; --mark:#D9B92E;
  --ok:#5BD08F; --ok-soft:#173527; --bad:#FF8A7F; --bad-soft:#3A1E1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px}
header h1{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
header h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%)}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row1{display:flex;gap:8px;align-items:center}
.row1 button{flex:none}
select{flex:1;min-width:0;font:600 1rem var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 .86rem var(--sans);padding:8px 4px;border-radius:9px;cursor:pointer;line-height:1.2}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--paper)}
.btn{font:600 .92rem var(--sans);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:focus-visible,.tabs button:focus-visible,select:focus-visible,input:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}
.status .hint{color:var(--muted);font-size:.88rem}
.score{font:500 .9rem var(--mono);background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.list{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:2.6rem 1fr;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.num{font:500 .8rem var(--mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.prompt{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.prompt.vn{font-weight:600;font-size:1rem}
input[type=text]{width:100%;font:500 1rem var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.item.ok input{border-color:var(--ok);background:var(--ok-soft)}
.item.bad input{border-color:var(--bad);background:var(--bad-soft)}
.ans{font-size:.9rem;color:var(--muted)}
.ans b{color:var(--ok)}
.item.bad .ans b{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* flashcard */
.fc-wrap{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;min-height:260px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer;position:relative;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 54px;transition:transform .25s}
.card .tag{position:absolute;top:12px;left:16px;font:500 .78rem var(--mono);color:var(--muted)}
.card .known{position:absolute;top:10px;right:14px;font-size:.78rem;font-weight:700;color:var(--ok)}
.card .front{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;background:var(--paper);padding:0 6px}
.card .front.vn{font-size:1.25rem;font-weight:700}
.card .back{display:flex;flex-direction:column;gap:8px;background:var(--paper);padding:6px;border-radius:8px;max-width:100%}
.card .back .w{font-size:1.3rem;font-weight:800}
.card .back .m{font-size:1.08rem;font-weight:600;color:var(--accent)}
.card .back .o{font-size:.86rem;color:var(--muted)}
.card .back .ex{font-size:.92rem;font-style:italic}
.card .tap{font-size:.8rem;color:var(--muted);background:var(--paper);padding:0 6px}
.card .rel{margin:6px 0 0;display:flex;flex-direction:column;gap:6px;text-align:left;border-top:1px dashed var(--line);padding-top:10px;width:100%}
.card .rel div{display:grid;grid-template-columns:6.6rem 1fr;gap:8px;align-items:baseline}
.card .rel dt{font:600 .72rem var(--sans);text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:6px;text-align:center}
.card .rel dt.sy{background:var(--ok-soft);color:var(--ok)}
.card .rel dt.an{background:var(--bad-soft);color:var(--bad)}
.card .rel dt.re{background:var(--accent-soft);color:var(--accent)}
.card .rel dd{margin:0;font-size:.92rem;overflow-wrap:anywhere;min-width:0}
.card .back{width:100%;max-width:520px}
.fc-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fc-sub{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fc-sub .btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* fill blank */
.sent{font-size:1rem;line-height:1.6}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;font-weight:700;padding:0 4px}
.item.ok .blank{color:var(--ok);border-color:var(--ok)}
.item.bad .blank{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{font:500 .93rem var(--sans);text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;cursor:pointer;overflow-wrap:anywhere}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.passage .ptype{font:500 .78rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.passage .ptitle{font-weight:800;font-size:1.15rem;margin:0;text-wrap:balance}
.passage .ptext{font-size:1rem;line-height:1.7;max-width:68ch}
.passage .ptext p{margin:0 0 8px}
.passage mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 3px;font-weight:600;cursor:help;border-bottom:2px solid var(--accent)}
.passage mark[data-open="1"]::after{content:" (" attr(data-m) ")";font-weight:500;color:var(--accent)}
.vtoggle{align-self:flex-start}
.qnum{font:500 .8rem var(--mono);color:var(--muted)}
.expl{font-size:.9rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.item.ok .expl{border-left:3px solid var(--ok)}
.item.bad .expl{border-left:3px solid var(--bad)}
.section-h{font-weight:700;font-size:1rem;margin:18px 0 8px}
@media (max-width:620px){.tabs{grid-template-columns:repeat(3,1fr)}}
.empty{padding:20px;color:var(--muted);text-align:center}
@media (max-width:420px){.opts{grid-template-columns:1fr}.tabs button{font-size:.8rem}.card .front{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Sổ từ vựng TOEIC</span></h1>
    <p>Bài 1–29: 582 từ trong sổ của anh, giữ đúng thứ tự. Bài 30–59: 602 từ TOEIC cốt lõi theo chủ đề. Mỗi bài 20 từ, có đọc hiểu và ngữ pháp.</p>
  </header>

  <div class="bar">
    <div class="row1">
      <button class="btn" id="prev" aria-label="Bài trước">‹</button>

      <button class="btn" id="next" aria-label="Bài sau">›</button>

    <div class="tabs" role="tablist">

      <button role="tab" data-mode="gram" aria-selected="false">Ngữ pháp</button>
    </div>
  </div>

  <main id="main"></main>
</div>

<script>
const BUNDLE={"w":[{"n":1,"w":"faithful","m":"trung thành, chung thủy","o":"faithful – trung thành, chung thủy","a":"faithful","s":"She has been a ___ customer of the bakery for ten years.","g":0,"sy":"loyal, devoted, dedicated","an":"disloyal, unfaithful","re":"faith (n), faithfully (adv), faithfulness (n)"},{"n":2,"w":"honesty","m":"sự trung thực","o":"honesty – sự trung thực","a":"honesty","s":"The manager praised the cashier's ___ after she returned the lost wallet.","g":0,"sy":"integrity, sincerity, truthfulness","an":"dishonesty, deceit","re":"honest (a), honestly (adv)"},{"n":3,"w":"relevant","m":"có liên quan","o":"relevant – có liên quan","a":"relevant","s":"Please attach only documents that are ___ to the application.","g":0,"sy":"related, pertinent, applicable","an":"irrelevant, unrelated","re":"relevance (n), relevantly (adv)"},{"n":4,"w":"superintendent","m":"giám thị, người giám sát","o":"superintendent – giám thị, người giám sát","a":"superintendent","s":"The building ___ will inspect the heating system on Monday.","g":0,"sy":"supervisor, manager, overseer","an":"","re":"supervise (v), superintend (v)"},{"n":5,"w":"lecture","m":"bài giảng","o":"lecture – bài giảng","a":"lecture","s":"Professor Kim's ___ on renewable energy lasted two hours.","g":0,"sy":"talk, speech, presentation","an":"","re":"lecturer (n), lecture hall (n)"},{"n":6,"w":"journalist","m":"nhà báo","o":"journalist – nhà báo","a":"journalist","s":"A ___ from the local newspaper interviewed the new mayor.","g":0,"sy":"reporter, correspondent","an":"","re":"journal (n), journalism (n)"},{"n":7,"w":"appropriate","m":"thích hợp, phù hợp, approriate + to","o":"appropriate – thích hợp, phù hợp, approriate + to","a":"appropriate","s":"Business attire is ___ for the annual awards dinner.","g":0,"sy":"suitable, proper, fitting","an":"inappropriate, unsuitable","re":"appropriately (adv), appropriate for/to"},{"n":8,"w":"brief","m":"ngắn gọn","o":"brief – ngắn gọn","a":"brief","s":"Ms. Tran gave a ___ summary of the quarterly results.","g":0,"sy":"short, concise, quick","an":"long, lengthy","re":"briefly (adv), brief (v), briefing (n)"},{"n":9,"w":"former","m":"trước đây, cũ","o":"former – trước đây, cũ","a":"former","s":"The ___ CEO will remain on the board as an advisor.","g":0,"sy":"previous, past, prior","an":"future, current","re":"formerly (adv), the former / the latter"},{"n":10,"w":"potential","m":"tiềm năng, potential customer","o":"potential – tiềm năng, potential customer","a":"potential","s":"The sales team contacted several ___ customers last week.","g":0,"sy":"possible, prospective, likely","an":"unlikely","re":"potentially (adv), potential (n)"},{"n":11,"w":"supplemental","m":"bổ sung","o":"supplemental – bổ sung","a":"supplemental","s":"___ materials for the course are available online.","g":0,"sy":"additional, extra, supplementary","an":"basic, main","re":"supplement (n/v), supplementally (adv)"},{"n":12,"w":"attention","m":"sự chú ý","o":"attention – sự chú ý","a":"attention","s":"Thank you for your ___ to this matter.","g":0,"sy":"focus, notice, concentration","an":"inattention, neglect","re":"attend (v), attentive (a), pay attention to"},{"n":13,"w":"proposal","m":"đề xuất, bản đề nghị","o":"proposal – đề xuất, bản đề nghị","a":"proposal","s":"The board approved the ___ to open a new branch in Da Nang.","g":0,"sy":"plan, suggestion, offer","an":"","re":"propose (v), proposed (a)"},{"n":14,"w":"innovation","m":"sự đổi mới, sáng tạo","o":"innovation – sự đổi mới, sáng tạo","a":"innovation","s":"The company is known for its ___ in battery technology.","g":0,"sy":"creativity, invention, novelty","an":"tradition","re":"innovate (v), innovative (a), innovator (n)"},{"n":15,"w":"criticism","m":"sự chỉ trích, phê bình","o":"criticism – sự chỉ trích, phê bình","a":"criticism","s":"The new policy received strong ___ from employees.","g":0,"sy":"disapproval, complaint, critique","an":"praise, approval","re":"criticize (v), critic (n), critical (a)"},{"n":16,"w":"faculty","m":"khoa (trong trường đại học), giảng viên, khả năng tự nhiên (nghe, nói, suy nghĩ)","o":"faculty – khoa (trong trường đại học), giảng viên, khả năng tự nhiên (nghe, nói, suy nghĩ)","a":"faculty","s":"Members of the engineering ___ will attend the conference.","g":0,"sy":"ability, capability; teaching staff","an":"","re":"faculty member, faculty of law"},{"n":17,"w":"facility","m":"cơ sở vật chất, dịch vụ, tiện nghi, năng khiếu, năng lực. Sports facility, medical facility, laundry facilities.","o":"facility – cơ sở vật chất, dịch vụ, tiện nghi, năng khiếu, năng lực. Sports facility, medical facility, laundry facilities.","a":"facility","s":"The hotel's fitness ___ is open 24 hours a day.","g":0,"sy":"amenity, building, equipment","an":"","re":"facilitate (v), sports facility, medical facility"},{"n":18,"w":"anxious","m":"lo lắng, bồn chồn","o":"anxious – lo lắng, bồn chồn","a":"anxious","s":"Many applicants were ___ about the interview results.","g":0,"sy":"worried, nervous, uneasy","an":"calm, relaxed","re":"anxiety (n), anxiously (adv)"},{"n":19,"w":"anticipated","m":"được mong đợi, dự đoán trước","o":"anticipated – được mong đợi, dự đoán trước","a":"anticipated","s":"The ___ launch of the new phone drew large crowds.","g":0,"sy":"expected, awaited, predicted","an":"unexpected","re":"anticipate (v), anticipation (n)"},{"n":20,"w":"predicted","m":"được dự đoán","o":"predicted – được dự đoán","a":"predicted","s":"Analysts ___ that sales would rise by 10 percent.","g":0,"sy":"forecast, expected, foreseen","an":"unexpected, unforeseen","re":"predict (v), prediction (n), predictable (a)"},{"n":21,"w":"forecasted","m":"được dự báo","o":"forecasted – được dự báo","a":"forecasted","s":"Heavy rain is ___ for the weekend.","g":0,"sy":"predicted, expected, projected","an":"unexpected","re":"forecast (n/v), weather forecast"},{"n":22,"w":"affordability","m":"khả năng chi trả, affordable: phải chăng, vừa phải","o":"affordability – khả năng chi trả, aff   const segs=m.split(/[,;/()=.]|\s-\s|\bhoặc\b/).map(norm).filter(s=>s.length>=2);

}

    const filled=inp.value.trim()!=='';const ok=filled&&vnMatch(inp.value,o.m);if(ok)c++;

  $('#main').innerHTML=`<div class="status"><span class="hint">Gõ từ tiếng Anh. Gợi ý ô trống là chữ cái đầu và số chữ cái.</span><span class="score" id="sc">—/${list.length}</span></div>
  <div class="list">${list.map(o=>{const ph=o.w[0]+'…  ('+o.w.replace(/[^a-zA-Z]/g,'').length+' chữ cái)';return `<div class="item" data-n="${o.n}"><div class="num">${o.n}</div><div class="body">
  <div class="prompt vn">${esc(maskWord(o.m,o.w))}</div><input type="text" id="vn-${o.n}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(ph)}"><div class="ans" hidden></div></div></div>`}).join('')}</div>
  <div class="actions"><button class="btn primary" id="chk">Kiểm tra</button><button class="btn" id="show">Xem đáp án</button><button class="btn" id="reset">Làm lại</button></div>`;
  const check=reveal=>{let c=0;list.forEach(o=>{const it=$(`.item[data-n="${o.n}"]`),inp=it.querySelector('input'),a=it.querySelector('.ans');
    const filled=inp.value.trim()!=='';const x=norm(inp.value);const ok=filled&&(x===norm(o.w)||x===norm(o.a));if(ok)c++;
    it.classList.toggle('ok',ok);it.classList.toggle('bad',filled&&!ok||reveal&&!ok);
    if(filled||reveal){a.hidden=false;a.innerHTML=`<b>${ok?'Đúng':'Đáp án'}:</b> ${esc(o.w)}`}});
    $('#sc').textContent=`${c}/${list.length}`};
  $('#chk').onclick=()=>check(false);$('#show').onclick=()=>check(true);$('#reset').onclick=()=>renderVN(items);
  enterNext();
}
function enterNext(){const ins=[...document.querySelectorAll('#main input')];ins.forEach((el,i)=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();(ins[i+1]||$('#chk')).focus()}}))}

/* ---------- Flashcard ---------- */
let fcI=0,fcFlip=false,fcRev=store.get('fcRev',false),fcOrder=null,fcLesson=-1;
function renderFC(items){
  if(fcLesson!==L){fcOrder=items.map((_,i)=>i);fcI=0;fcFlip=false;fcLesson=L}
  const o=items[fcOrder[fcI]];const isK=known.has(o.n);
  const ex=o.s?o.s.replace('___',`<b>${esc(o.a)}</b>`):'';
  const kc=items.filter(x=>known.has(x.n)).length;
  const front=fcRev?`<div class="front vn">${esc(o.m)}</div>`:`<div class="front">${esc(o.w)}</div>`;
  const back=`<div class="back"><div class="w">${esc(o.w)}</div><div class="m">${esc(o.m)}</div>${o.o&&!o.g?`<div class="o">Ghi chú gốc: ${esc(o.o)}</div>`:''}${ex?`<div class="ex">${ex}</div>`:''}${(o.sy||o.an||o.re)?`<dl class="rel">${o.sy?`<div><dt class="sy">Đồng nghĩa</dt><dd>${esc(o.sy)}</dd></div>`:''}${o.an?`<div><dt class="an">Trái nghĩa</dt><dd>${esc(o.an)}</dd></div>`:''}${o.re?`<div><dt class="re">Từ liên quan</dt><dd>${esc(o.re)}</dd></div>`:''}</dl>`:''}</div>`;
  $('#main').innerHTML=`<div class="status"><span class="hint">Chạm thẻ để lật. Phím ← → để chuyển, phím cách để lật.</span><span class="score">${fcI+1}/${items.length} · thuộc ${kc}</span></div>
  <div class="fc-wrap"><div class="progress"><i style="width:${(fcI+1)/items.length*100}%"></i></div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="Lật thẻ"><span class="tag">#${o.n}</span>${isK?'<span class="known">✓ Đã thuộc</span>':''}
  ${fcFlip?back:front+'<div class="tap">Chạm để xem nghĩa</div>'}</div>
  <div class="fc-nav"><button class="btn" id="fp">‹ Trước</button><button class="btn primary" id="ff">Lật thẻ</button><button class="btn" id="fn">Sau ›</button></div>
  <div class="fc-sub"><button class="btn ${isK?'on':''}" id="fk">${isK?'✓ Đã thuộc':'Đánh dấu đã thuộc'}</button><button class="btn" id="fr">${fcRev?'Hiện tiếng Anh trước':'Hiện tiếng Việt trước'}</button><button class="btn" id="fs">Trộn thẻ</button><button class="btn" id="fo">Theo thứ tự</button></div></div>`;
  const flip=()=>{fcFlip=!fcFlip;renderFC(items)};
  const go=d=>{fcI=(fcI+d+items.length)%items.length;fcFlip=false;renderFC(items)};
  $('#card').onclick=flip;$('#ff').onclick=flip;$('#fp').onclick=()=>go(-1);$('#fn').onclick=()=>go(1);
  $('#fk').onclick=()=>{known.has(o.n)?known.delete(o.n):known.add(o.n);store.set('known',[...known]);renderFC(items)};
  $('#fr').onclick=()=>{fcRev=!fcRev;store.set('fcRev',fcRev);fcFlip=false;renderFC(items)};
  $('#fs').onclick=()=>{fcOrder=shuffle(fcOrder,Math.random);fcI=0;fcFlip=false;renderFC(items)};
  $('#fo').onclick=()=>{fcOrder=items.map((_,i)=>i);fcI=0;fcFlip=false;renderFC(items)};
}
document.addEventListener('keydown',e=>{if(MODE!=='fc'||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight')$('#fn')?.click();else if(e.key==='ArrowLeft')$('#fp')?.click();else if(e.key===' '){e.preventDefault();$('#ff')?.click()}});

/* ---------- Điền từ ---------- */
function renderFill(items){
  const list=items.filter(o=>o.s);
  const pool=[...new Set(list.map(o=>o.a.toLowerCase()))];
  let done=0,right=0;
  $('#main').innerHTML=`<div class="status"><span class="hint">Chọn từ thích hợp điền vào chỗ trống.</span><span class="score" id="sc">0/${list.length}</span></div>
  <div class="list">${list.map(o=>{const r=rng(o.n*7919+L);const others=shuffle(pool.filter(p=>p!==o.a.toLowerCase()),r).slice(0,3);
    const opts=shuffle([o.a.toLowerCase(),...others],r);
    return `<div class="item" data-n="${o.n}"><div class="num">${o.n}</div><div class="body">
    <div class="sent">${esc(o.s).replace('___','<span class="blank">&nbsp;</span>')}</div>
    <div class="opts">${opts.map((p,i)=>`<button class="opt" data-v="${esc(p)}">${String.fromCharCode(65+i)}. ${esc(p)}</button>`).join('')}</div></div></div>`}).join('')}</div>
  <div class="actions"><button class="btn" id="reset">Làm lại</button></div>`;
  list.forEach(o=>{const it=$(`.item[data-n="${o.n}"]`);it.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const ok=b.dataset.v===o.a.toLowerCase();done++;if(ok)right++;
    it.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===o.a.toLowerCase())x.classList.add('right')});
    if(!ok)b.classList.add('wrong');
    it.classList.add(ok?'ok':'bad');
    const bl=it.querySelector('.blank');const first=o.s.trim().startsWith('___');bl.textContent=first?o.a.charAt(0).toUpperCase()+o.a.slice(1):o.a;
    $('#sc').textContent=`${right}/${list.length}`+(done===list.length?' · xong':'');
  })});
  $('#reset').onclick=()=>renderFill(items);
}
/* ---------- Đọc hiểu ---------- */
function markPassage(p,items){
  const map={};items.forEach(o=>{map[o.w.toLowerCase()]=o.m});
  const paras=esc(p).split('\n').map(par=>par.replace(/\[\[(.+?)\]\]([a-z]*)/g,(m,w,suf)=>{
    const lw=w.toLowerCase();const o=items.find(x=>x.w.toLowerCase()===lw)||items.find(x=>x.a&&x.a.toLowerCase()===lw)||items.find(x=>lw.includes(x.w.toLowerCase())||x.w.toLowerCase().includes(lw))||DATA.find(x=>x.w.toLowerCase()===lw||(x.a&&x.a.toLowerCase()===lw));
    const mean=o?o.m:'';return `<mark tabindex="0" data-m="${esc(mean)}" title="${esc(mean)}">${w}${suf}</mark>`;}));
  return paras.map(x=>`<p>${x}</p>`).join('');
}
function renderRead(items){
  const r=LMETA[L].r;
  const [ptype,ptitle]=r.t.split(' — ');
  let right=0,done=0;
  $('#main').innerHTML=`<div class="status"><span class="hint">Đọc đoạn văn rồi trả lời câu hỏi. Chạm vào từ được tô để xem nghĩa.</span><span class="score" id="sc">0/${r.q.length}</span></div>
  <article class="passage"><div class="ptype">${esc(ptype||'')}</div><h2 class="ptitle">${esc(ptitle||r.t)}</h2><div class="ptext">${markPassage(r.p,items)}</div>
  <button class="btn vtoggle" id="vt">Hiện nghĩa tất cả từ tô màu</button></article>
  <div class="section-h">Câu hỏi</div>
  <div class="list">${r.q.map((q,qi)=>`<div class="item" data-q="${qi}"><div class="num">${qi+1}</div><div class="body">
    <div class="prompt vn" style="font-weight:600">${esc(q.q)}</div>
    <div class="opts">${q.o.map((x,i)=>`<button class="opt" data-i="${i}">${'ABCD'[i]}. ${esc(x)}</button>`).join('')}</div>
    <div class="expl" hidden>${esc(q.e)}</div></div></div>`).join('')}</div>
  <div class="actions"><button class="btn" id="reset">Làm lại</button></div>`;
  document.querySelectorAll('.passage mark').forEach(m=>{const tg=()=>m.dataset.open=m.dataset.open==='1'?'0':'1';m.onclick=tg;m.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();tg()}}});
  let allOpen=false;$('#vt').onclick=()=>{allOpen=!allOpen;document.querySelectorAll('.passage mark').forEach(m=>m.dataset.open=allOpen?'1':'0');$('#vt').textContent=allOpen?'Ẩn nghĩa':'Hiện nghĩa tất cả từ tô màu'};
  r.q.forEach((q,qi)=>{const it=$(`.item[data-q="${qi}"]`);it.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===q.a;done++;if(ok)right++;
    it.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');it.classList.add(ok?'ok':'bad');it.querySelector('.expl').hidden=false;
    $('#sc').textContent=`${right}/${r.q.length}`+(done===r.q.length?' · xong':'');})});
  $('#reset').onclick=()=>renderRead(items);
}

/* ---------- Ngữ pháp ---------- */
function renderGram(items){
  const g=LMETA[L].g;let right=0,done=0;
  const qs=g.map((q,qi)=>{const r=rng((L+1)*1009+qi*31);const ord=shuffle([0,1,2,3],r);return {...q,ord}});
  $('#main').innerHTML=`<div class="status"><span class="hint">Chọn đáp án đúng điền vào chỗ trống (kiểu TOEIC Part 5).</span><span class="score" id="sc">0/${qs.length}</span></div>
  <div class="list">${qs.map((q,qi)=>`<div class="item" data-q="${qi}"><div class="num">${101+qi}</div><div class="body">
    <div class="sent">${esc(q.s).replace('___','<span class="blank">&nbsp;</span>')}</div>
    <div class="opts">${q.ord.map((oi,k)=>`<button class="opt" data-i="${oi}">(${'ABCD'[k]}) ${esc(q.o[oi])}</button>`).join('')}</div>
    <div class="expl" hidden>${esc(q.e)}</div></div></div>`).join('')}</div>
  <div class="actions"><button class="btn" id="reset">Làm lại</button></div>`;
  qs.forEach((q,qi)=>{const it=$(`.item[data-q="${qi}"]`);it.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===q.a;done++;if(ok)right++;
    it.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('right')});
    if(!ok)b.classList.add('wrong');it.classList.add(ok?'ok':'bad');
    const bl=it.querySelector('.blank');const ans=q.o[q.a];bl.textContent=q.s.trim().startsWith('___')?ans.charAt(0).toUpperCase()+ans.slice(1):ans;
    it.querySelector('.expl').hidden=false;
    $('#sc').textContent=`${right}/${qs.length}`+(done===qs.length?' · xong':'');})});
  $('#reset').onclick=()=>renderGram(items);
}
render();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
